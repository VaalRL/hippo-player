<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 圓角漸層背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 品牌活力橘黃漸層 (何嘉仁品牌色) -->
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f19700" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 澄澈活力天藍漸層 -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 河馬身體萌感灰紫藍色漸層 -->
    <linearGradient id="hippoBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- 河馬吻部淺色漸層 -->
    <linearGradient id="hippoMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f19700" flood-opacity="0.35" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 外層圓角主背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- 外框亮橘微光邊圈 -->
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#brandOrange)" stroke-width="6" opacity="0.85" />

  <!-- 耳機頭帶 (Headband) -->
  <path d="M 120 230 A 136 136 0 0 1 392 230" fill="none" stroke="url(#brandOrange)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 120 230 A 136 136 0 0 1 392 230" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- 河馬小耳朵 (左 & 右) -->
  <g filter="url(#softShadow)">
    <circle cx="168" cy="172" r="30" fill="url(#hippoBody)" />
    <circle cx="168" cy="172" r="18" fill="#fda4af" opacity="0.85" />

    <circle cx="344" cy="172" r="30" fill="url(#hippoBody)" />
    <circle cx="344" cy="172" r="18" fill="#fda4af" opacity="0.85" />
  </g>

  <!-- 河馬頭部本體 -->
  <g filter="url(#softShadow)">
    <ellipse cx="256" cy="240" rx="122" ry="110" fill="url(#hippoBody)" />
  </g>

  <!-- 河馬圓潤大嘴吻部 (Muzzle) -->
  <g filter="url(#softShadow)">
    <path d="M 148 290 C 148 240, 364 240, 364 290 C 364 365, 148 365, 148 290 Z" fill="url(#hippoMuzzle)" />
    
    <!-- 可愛圓圓大鼻孔 (左右) -->
    <ellipse cx="206" cy="286" rx="15" ry="20" fill="#475569" transform="rotate(-8 206 286)" />
    <ellipse cx="204" cy="284" rx="5" ry="8" fill="#334155" />
    
    <ellipse cx="306" cy="286" rx="15" ry="20" fill="#475569" transform="rotate(8 306 286)" />
    <ellipse cx="308" cy="284" rx="5" ry="8" fill="#334155" />

    <!-- 萌萌小微笑 -->
    <path d="M 234 326 Q 256 342 278 326" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- 害羞腮紅 -->
    <ellipse cx="170" cy="316" rx="18" ry="10" fill="#fb7185" opacity="0.45" />
    <ellipse cx="342" cy="316" rx="18" ry="10" fill="#fb7185" opacity="0.45" />
  </g>

  <!-- 河馬大眼睛 (左 & 右) -->
  <g>
    <!-- 左眼 -->
    <ellipse cx="204" cy="216" rx="17" ry="22" fill="#0f172a" />
    <circle cx="198" cy="208" r="7" fill="#ffffff" />
    <circle cx="210" cy="222" r="3" fill="#ffffff" />

    <!-- 右眼 -->
    <ellipse cx="308" cy="216" rx="17" ry="22" fill="#0f172a" />
    <circle cx="302" cy="208" r="7" fill="#ffffff" />
    <circle cx="314" cy="222" r="3" fill="#ffffff" />

    <!-- 萌萌眼神光眉毛 -->
    <path d="M 188 184 Q 204 178 220 186" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <path d="M 292 186 Q 308 178 324 184" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 耳機兩側耳罩 (Left & Right Earcups) -->
  <g filter="url(#glow)">
    <!-- 左耳罩外殼與軟墊 -->
    <g transform="rotate(10 114 260)">
      <rect x="94" y="208" width="40" height="96" rx="20" fill="url(#brandOrange)" />
      <rect x="122" y="218" width="18" height="76" rx="9" fill="#0284c7" />
      <circle cx="114" cy="256" r="10" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- 右耳罩外殼與軟墊 -->
    <g transform="rotate(-10 398 260)">
      <rect x="378" y="208" width="40" height="96" rx="20" fill="url(#brandOrange)" />
      <rect x="372" y="218" width="18" height="76" rx="9" fill="#0284c7" />
      <circle cx="398" cy="256" r="10" fill="#ffffff" opacity="0.85" />
    </g>
  </g>

  <!-- 飄揚的歡樂音樂音符 (Floating Music Notes) -->
  <g fill="url(#accentBlue)" opacity="0.95" filter="url(#glow)">
    <!-- 右上方八分音符 -->
    <path d="M 405 140 C 405 130 415 110 435 110 L 435 145 C 430 142 422 142 417 146 C 410 152 412 162 420 165 C 428 168 438 162 438 152 L 438 122 C 448 122 458 130 460 142 Z" />
    
    <!-- 左上方高音音符點綴 -->
    <circle cx="95" cy="150" r="11" fill="url(#brandOrange)" />
    <path d="M 103 150 L 103 108 C 115 112 125 106 128 100" fill="none" stroke="url(#brandOrange)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 底部品牌文字與徽章 -->
  <g transform="translate(0, 420)">
    <rect x="126" y="0" width="260" height="46" rx="23" fill="url(#brandOrange)" filter="url(#glow)" />
    <text x="256" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">HIPPO PLAYER</text>
  </g>
</svg>
